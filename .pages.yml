media:
  input: images
  output: /images

content:
  - name: products
    label: Products
    type: collection
    path: products
    fields:
      - { name: name, label: Product name, type: string }
      - { name: price, label: Price, type: number }
      - { name: category, label: Category, type: select, options: { values: [bestsellers, fidgets, desk, jewelry, keychains, gifts, custom] } }
      - { name: images, label: Photos, type: image, list: true }
      - { name: best, label: Best seller?, type: boolean }
      - { name: isNew, label: New?, type: boolean }
      - { name: note, label: Note, type: string }
      - { name: size, label: Size, type: string }